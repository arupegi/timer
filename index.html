<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タイマー</title>
<style>
  body {
    margin: 0;
    background: blue;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-size: 60px;
    font-weight: bold;
    color: black;
    user-select: none;
  }
</style>
</head>
<body>

<div id="time">0.00 秒</div>

<script>
let state = 0; // 0=青,1=黄,2=赤
let startTime = 0;
let running = false;

function updateTimer() {
  if (!running) return;

  let elapsed = (performance.now() - startTime) / 1000;
  document.getElementById("time").textContent = elapsed.toFixed(2) + " 秒";

  // ★ 30秒で青に戻す（止めない）
  if (elapsed >= 30) {
    document.body.style.background = "blue";
  }

  requestAnimationFrame(updateTimer);
}

function nextColor() {
  if (state === 0) {
    state = 1;
    document.body.style.background = "yellow";

    startTime = performance.now();
    running = true;
    updateTimer();

  } else if (state === 1) {
    state = 2;
    document.body.style.background = "red";

  } else {
    state = 0;
    running = false;
    document.body.style.background = "blue";
    document.getElementById("time").textContent = "0.00 秒";
  }
}

document.body.addEventListener("click", nextColor);

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    nextColor();
  }
});
</script>

</body>
</html>
