<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タイマー</title>
<style>
  body {
    margin: 0;
    background: blue;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-size: 60px;
    font-weight: bold;
    color: black;
    user-select: none;
  }
</style>
</head>
<body>

<div id="time">0.00 秒</div>

<script>
let state = 0; // 0=青,1=黄,2=赤
let startTime = 0;
let running = false;

let locked = false;
let lockStart = 0;
const LOCK_TIME = 300; // 5分（秒）

// タップ検出用
let tapTimes = [];

// =====================
// タイマー更新
// =====================
function updateTimer() {
  if (locked) {
    let elapsedLock = (performance.now() - lockStart) / 1000;
    let remain = Math.max(0, LOCK_TIME - elapsedLock);

    let min = Math.floor(remain / 60);
    let sec = Math.floor(remain % 60);

    document.getElementById("time").textContent =
      `LOCK ${min}:${sec.toString().padStart(2, "0")}`;

    document.body.style.background = "gray";

    if (remain <= 0) {
      locked = false;
      state = 0;
      document.body.style.background = "blue";
      document.getElementById("time").textContent = "0.00 秒";
      return;
    }

    requestAnimationFrame(updateTimer);
    return;
  }

  if (!running) return;

  let elapsed = (performance.now() - startTime) / 1000;
  document.getElementById("time").textContent = elapsed.toFixed(2) + " 秒";

  if (elapsed >= 30) {
    document.body.style.background = "blue";
  }

  requestAnimationFrame(updateTimer);
}

// =====================
// リセット
// =====================
function reset() {
  state = 0;
  running = false;
  locked = false;
  document.body.style.background = "blue";
  document.getElementById("time").textContent = "0.00 秒";
}

// =====================
// タップ処理
// =====================
function handleTap() {
  let now = performance.now();

  // 3連打判定（200ms以内）
  tapTimes.push(now);
  tapTimes = tapTimes.filter(t => now - t <= 1000);

  if (tapTimes.length >= 3) {
    reset();
    tapTimes = [];
    return;
  }

  if (locked) return;

  if (state === 0) {
    state = 1;
    document.body.style.background = "yellow";

    startTime = performance.now();
    running = true;
    updateTimer();

  } else if (state === 1) {
    state = 2;
    document.body.style.background = "red";

  } else if (state === 2) {
    let elapsed = (performance.now() - startTime) / 1000;

    if (elapsed < 30) {
      // ❌ フライング → ロック
      locked = true;
      running = false;
      lockStart = performance.now();
      updateTimer();
    } else {
      // 成功 → 青に戻る（継続）
      state = 0;
      document.body.style.background = "blue";
    }
  }
}

// =====================
// イベント
// =====================
document.body.addEventListener("click", handleTap);

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    handleTap();
  }
});
</script>

</body>
</html>
